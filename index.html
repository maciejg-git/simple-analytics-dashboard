<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link href="./output.css" rel="stylesheet">
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- chartjs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- alpine store -->
    <script src="/store-table.js"></script>
    <!-- alpine components -->
    <script src="/alpine-dashboard.js"></script>
    <script src="/alpine-chart.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpine-remote-component@0.1.14/remote-component/dist/cdn.min.js"></script>
    <!-- litewind alpine -->
    <script defer src="https://cdn.jsdelivr.net/npm/litewind-alpine@0.x.x/plugins/use-floating/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/litewind-alpine@0.x.x/components/dropdown/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/litewind-alpine@0.x.x/components/datepicker/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/litewind-alpine@0.x.x/components/table/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.6/dist/htmx.min.js" integrity="sha384-Akqfrbj/HpNVo8k11SXBb6TlBWmXXlYQrCSqEWmyKJe+hDm3Z/B2WVG4smwBkRVm" crossorigin="anonymous"></script>
    <!-- alpine -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>
  <body>
    <nav class="w-full sticky top-0 bg-white border-b border-gray-200 z-10 py-2 pl-4">
      <span class="text-lg font-semibold">
        Simple Analytics Dashboard
      </span>
    </nav>
    <div x-data="dashboard">
      <!-- container -->
      <div class="flex">
        <!-- left column -->
        <div class="px-10 border-r border-gray-200 min-h-screen flex flex-col gap-y-4 pt-4">
          <div class="flex flex-col gap-y-2">
            <span class="font-semibold">Hostname</span>
            <ul>
              <template x-for="item in uniqueHostnames">
                <li>
                  <span
                    x-text="item.hostname"
                    @click="currentHostname = item.hostname"
                    :class="{ 'font-semibold': currentHostname === item.hostname }"
                  ></span>
                </li>
              </template>
            </ul>
          </div>
          <ul>
            <li>
              Today
            </li>
            <li>
              This week
            </li>
            <li>
              This month
            </li>
            <li>
              <div
                x-data="dropdown"
                data-auto-close="false"
                x-on:datepicker-selection-complete="close()"
              >
                <button
                  x-bind="trigger"
                >
                  Date range
                </button>
                <div
                  x-bind="menu"
                  x-cloak
                  x-alt-transition='{
                    "enter": ["opacity-0 scale-y-50", "transition ease-out duration-100 origin-top", "opacity-100"],
                    "leave": ["opacity-100", "transition ease-in duration-100 origin-top", "opacity-0 scale-y-50"]
                  }'
                  class="z-50"
                >
                  <div
                    x-remote-component="/components/datepicker.html"
                    prop:x-model="currentDateRange"
                  ></div>
                </div>
              </div>
            </li>
          </ul>
        </div>
        <!-- right column -->
        <div class="flex flex-col gap-y-8 p-4">
          <!-- hostname and boxes -->
          <div class="flex flex-col gap-y-4 border-l-4 border-gray-200 pl-4">
            <!-- current hostname -->
            <div x-text="currentHostname" class="text-3xl font-semibold"></div>
            <!-- number boxes -->
            <div class="flex gap-x-4">
              <div
                class="flex flex-col items-center rounded-md border border-gray-200 px-6 py-1"
              >
                <span x-text="viewCount" class="font-semibold"></span>
                <span class="text-sm text-gray-600">Total visits</span>
              </div>
              <div
                class="flex flex-col items-center rounded-md border border-gray-200 px-6 py-1"
              >
                <span x-text="mostViewedPathnames[0]?.pathname" class="font-semibold"></span>
                <span class="text-sm text-gray-600">Most visited path</span>
              </div>
            </div>
          </div>
          <!-- charts -->
          <div class="flex gap-x-4">
            <!-- chart card -->
            <div x-remote-component="/components/chart.html">
              <template data-for-slot="title">
                Daily views
              </template>
              <template data-for-slot="chart">
                <div
                  x-data="chart"
                  :data-labels="charts.dailyViews.labels"
                  :data-items="charts.dailyViews.items"
                  :data-options="charts.dailyViews.options"
                  class="h-60"
                >
                  <canvas></canvas>
                </div>
              </template>
            </div>
            <div x-remote-component="/components/chart.html">
              <template data-for-slot="title">
                Most viewed pathnames
              </template>
              <template data-for-slot="chart">
                <div
                  x-data="chart"
                  :data-type="charts.mostViewedPathnames.type"
                  :data-labels="charts.mostViewedPathnames.labels"
                  :data-items="charts.mostViewedPathnames.items"
                  :data-options="charts.mostViewedPathnames.options"
                  class="h-60"
                >
                  <canvas></canvas>
                </div>
              </template>
            </div>
          </div>
          <div>
            <div
              x-remote-component="/components/table.html"
              prop::data-items="viewData"
              prop:data-primary-key="id"
            ></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
